name: Close Stale Issues and PRs

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: stale
          exempt-issue-labels: 'blocked,security,good first issue,help wanted'
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had activity in the last 60 days.
            It will be closed in 14 days if no further activity occurs. Thank you for your contributions.

          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: stale
          exempt-pr-labels: 'blocked,security,work in progress'
          stale-pr-message: |
            This PR has been automatically marked as stale because it has not had activity in the last 30 days.
            It will be closed in 14 days if no further activity occurs.
